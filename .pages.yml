# Pages CMS — Web-Ustawienia: Ustawienia całej strony: menu, stopka, skróty, baner, nagłówki działów, tło i sekcje, deklaracja dostępności, polityka prywatności.
# Wygenerowane przy migracji z Avean/IM-Website-test; pola „Opublikowany” usunięte (bez wersji roboczych).
# Zlecenie 40: opisy formularzy (tylko właściciel; gdzie widać), Facebook i YouTube w stopce, podłączone zdjęcia nagłówków działów, usunięte resztki starego banera i przyciski okładki, ukryte hasła bez liczb; deklaracja, prywatność i „O stronie” w jawnym Markdownie.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: ustawienia-grupa
  label: Ustawienia strony
  type: group
  items:
  - name: ustawienia
    label: Strona główna i kontakt
    description: Tylko właściciel. Okładka strony głównej (zdjęcie, tekst pod nazwą Instytutu, wydarzenia), sekcja „Studiuj matematykę” i menu „Studia”, zdjęcia w nagłówkach działów, kontakt i profile w stopce.
    type: file
    path: src/data/ustawienia.json
    format: json
    fields:
    - name: baner
      label: Baner na stronie głównej
      description: Zdjęcie okładki strony głównej (pierwszy ekran). Rozmiar i kadr na komputerze i telefonie strona dobiera sama.
      type: object
      fields:
      - name: zdjecie
        label: Zdjęcie (poziome, ok. 2400 px szerokości)
        type: image
        options:
          path: public/pliki/baner
      - name: opis
        label: Opis zdjęcia (dla niewidomych)
        description: Co widać na zdjęciu, jednym zdaniem; czytają je czytniki ekranu. Np. „Kampus przy placu Grunwaldzkim o zmierzchu…”.
        type: string
      - name: opis_en
        label: 'Opis zdjęcia EN'
        type: string
      - name: podpis_telefon
        label: Podpis na telefonie (nieużywany)
        type: string
        hidden: true
      - name: podpis_telefon_en
        label: 'Podpis na telefonie EN (nieużywany)'
        type: string
        hidden: true
    - name: logo
      label: Logo w nagłówku (opcjonalnie)
      type: image
      options:
        path: public/pliki
    - name: tlo_strony
      label: Tło strony
      hidden: true
      type: select
      default: zmierzch
      options:
        values:
        - name: zmierzch
          label: Zmierzch
        - name: pole
          label: Pole kierunków
        - name: kratka
          label: Kratka / tablica
        - name: penrose
          label: Kafelkowanie Penrose'a
        - name: fale
          label: Fale (izolinie)
        - name: brak
          label: Brak (białe)
    - name: sekcje
      label: Oddzielanie sekcji
      hidden: true
      type: select
      default: pasy
      options:
        values:
        - name: pasy
          label: Pasy
        - name: linia
          label: Linia
        - name: karty
          label: Karty
        - name: brak
          label: Brak
    - name: naglowki_podstron
      label: Nagłówki działów
      description: Zdjęcia w nagłówkach stron działów i ich podstron (komputer i telefon).
      type: object
      fields:
      - name: wariant
        label: Wygląd
        type: select
        default: granat
        options:
          values:
          - name: granat
            label: Granatowy pas
          - name: zdjecie
            label: Zdjęcie w ramce
          - name: motyw
            label: Sam rysunek
          - name: prosty
            label: Prosty
        hidden: true
      - name: zdjecia
        label: Zdjęcia działów
        description: Puste zdjęcie albo kadr = zdjęcie i kadr domyślne działu.
        type: object
        fields:
        - name: instytut
          label: Instytut
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            description: Zdjęcie poziome, co najmniej ok. 1200 px szerokości. Puste = zdjęcie domyślne działu.
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr
            description: "Który fragment zdjęcia widać, gdy strona je przycina: położenie w poziomie i w pionie w procentach, np. „50% 40%” (środek, trochę powyżej połowy). Działa na stronie działu; podstrony mają stały kadr. Puste = kadr domyślny."
            type: string
        - name: nauka
          label: Nauka
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            description: Zdjęcie poziome, co najmniej ok. 1200 px szerokości. Puste = zdjęcie domyślne działu.
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr
            description: "Który fragment zdjęcia widać, gdy strona je przycina: położenie w poziomie i w pionie w procentach, np. „50% 40%” (środek, trochę powyżej połowy). Działa na stronie działu; podstrony mają stały kadr. Puste = kadr domyślny."
            type: string
        - name: studia
          label: Studia
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            description: Zdjęcie poziome, co najmniej ok. 1200 px szerokości. Puste = zdjęcie domyślne działu.
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr
            description: "Który fragment zdjęcia widać, gdy strona je przycina: położenie w poziomie i w pionie w procentach, np. „50% 40%” (środek, trochę powyżej połowy). Działa na stronie działu; podstrony mają stały kadr. Puste = kadr domyślny."
            type: string
        - name: aktualnosci
          label: Aktualności
          description: Nagłówki Aktualności, Kalendarza i listy „Warto wiedzieć”.
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            description: Zdjęcie poziome, co najmniej ok. 1200 px szerokości. Puste = zdjęcie domyślne działu.
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr
            description: "Który fragment zdjęcia widać, gdy strona je przycina: położenie w poziomie i w pionie w procentach, np. „48% 52%”. Puste = kadr domyślny."
            type: string
        - name: popularyzacja
          label: Popularyzacja
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            description: Zdjęcie poziome, co najmniej ok. 1200 px szerokości. Puste = zdjęcie domyślne działu.
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr
            description: "Który fragment zdjęcia widać, gdy strona je przycina: położenie w poziomie i w pionie w procentach, np. „50% 40%” (środek, trochę powyżej połowy). Działa na stronie działu; podstrony mają stały kadr. Puste = kadr domyślny."
            type: string
    - name: wydarzenia_dni_robocze
      label: 'Wydarzenia na stronie głównej: ile dni roboczych przed początkiem się pojawiają (sekcja znika, gdy nic nie ma)'
      type: number
      default: 5
    - name: wydarzenia_dni_telefon
      label: 'Nadchodzące wydarzenia na telefonie: ile dni naprzód'
      type: number
    - name: wstep
      label: Tekst pod nazwą Instytutu
      type: text
    - name: wstep_en
      label: 'Tekst pod nazwą EN'
      type: text
    - name: haslo
      label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
      hidden: true
      type: string
    - name: haslo_en
      label: 'Hasło na banerze EN'
      hidden: true
      type: string
    - name: szukaj_haslo
      label: 'Hasło na banerze: Szukaj'
      type: string
      hidden: true
    - name: szukaj_haslo_en
      label: 'Hasło na banerze: Szukaj EN'
      type: string
      hidden: true
    - name: studia
      label: Sekcja „Studiuj matematykę”
      type: object
      fields:
      - name: tytul
        label: Tytuł
        type: string
      - name: tytul_en
        label: 'Tytuł EN'
        type: string
      - name: opis
        label: Opis
        type: string
      - name: opis_en
        label: 'Opis EN'
        type: string
      - name: rekrutacja
        label: Link do rekrutacji
        type: string
      - name: kierunki
        label: Kierunki w menu „Studia” i kafelki na stronie głównej
        description: "Tylko pozycje z tej listy są w menu „Studia” (komputer i telefon), na stronie /studia i w kafelkach na stronie głównej, w kolejności listy. Nowy kierunek pojawi się w menu i kafelkach dopiero po dodaniu go tutaj. Strona pokazuje pola tak, jak są wpisane: puste pole zostaje puste."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nazwa}"
        fields:
        - name: adres
          label: Adres
          description: "Adres strony kierunku: /studia/ i nazwa pliku z Web-Studia → Kierunki, np. /studia/matematyka, /studia/podyplomowe."
          type: string
          required: true
        - name: nazwa_menu
          label: Nazwa w menu
          description: "Nazwa w menu „Studia” i na stronie /studia, np. Matematyka, Studia podyplomowe. Sztuczną inteligencję w analizie danych strona skraca do SIAD."
          type: string
          required: true
        - name: opis_menu
          label: Opis w menu
          description: "Krótki opis pod nazwą w menu „Studia”, np. I i II stopień, pięć specjalności."
          type: string
          required: true
        - name: nazwa
          label: Nazwa na kafelku
          description: "Nazwa na kafelku na stronie głównej, np. Matematyka, Nauczanie matematyki."
          type: string
          required: true
        - name: poziom
          label: Napis nad nazwą na kafelku
          description: "Np. I i II stopień, Kierunek, III stopień, Podyplomowe. Puste: kafelek bez napisu."
          type: string
        - name: opis
          label: Zdanie na kafelku
          description: "Jedno krótkie zdanie pod nazwą, np. Nowy program studiów od roku 2026/27. Puste: kafelek bez zdania."
          type: string
        - name: w_menu
          label: Pokaż w menu „Studia”
          type: boolean
          default: true
        - name: na_stronie_glownej
          label: Pokaż kafelek na stronie głównej
          type: boolean
          default: true
        - name: nazwa_menu_en
          label: Nazwa w menu EN
          type: string
        - name: opis_menu_en
          label: Opis w menu EN
          type: string
        - name: nazwa_en
          label: Nazwa na kafelku EN
          type: string
        - name: poziom_en
          label: Napis nad nazwą na kafelku EN
          type: string
        - name: opis_en
          label: Zdanie na kafelku EN
          type: string
        - name: pozycja
          type: boolean
          hidden: true
    - name: kontakt
      label: Dane kontaktowe (stopka)
      type: object
      fields:
      - name: adres
        label: Adres
        type: string
      - name: telefon
        label: Telefon
        type: string
      - name: email
        label: E-mail
        type: string
    - name: facebook
      label: Facebook (adres profilu)
      description: Ikona z linkiem w stopce każdej strony, polskiej i angielskiej. Np. https://www.facebook.com/IMUWr. Puste = bez ikony.
      type: string
    - name: youtube
      label: YouTube (adres kanału)
      description: Ikona z linkiem w stopce każdej strony, polskiej i angielskiej. Np. https://www.youtube.com/channel/…. Puste = bez ikony.
      type: string
    - name: archiwum
      label: Adres archiwum starej strony
      type: string
    - name: powiadomienia
      label: Powiadomienia e-mail o referatach
      type: object
      fields:
      - name: adres
        label: Adres automatu listy mailingowej (Google Apps Script, …/exec; puste = zapisy wyłączone)
        type: string
    - name: partnerzy
      label: Partnerzy (logotypy w stopce)
      hidden: true
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{nazwa}"
      fields:
      - name: nazwa
        label: Nazwa
        type: string
        required: true
      - name: logo
        label: Logo
        type: image
        options:
          path: public/pliki/partnerzy
      - name: adres
        label: Strona partnera
        type: string
      - name: pozycja
        type: boolean
        hidden: true
  - name: skroty
    label: Kafelki „Na skróty”
    description: Tylko właściciel. Pierwsze cztery kafelki widać na stronie głównej, w pasku „Szybki dostęp” pod okładką.
    type: file
    path: src/data/skroty.json
    format: json
    fields:
    - name: kafelki
      label: Kafelki
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{etykieta}"
      fields:
      - name: etykieta
        label: Etykieta
        type: string
        required: true
      - name: etykieta_en
        label: 'Etykieta EN'
        type: string
      - name: adres
        label: Adres (np. /pracownicy albo https://…)
        type: string
        required: true
      - name: ikona
        label: Ikona
        type: select
        options:
          values:
          - name: kalendarz
            label: Kalendarz
          - name: zegar
            label: Zegar
          - name: ludzie
            label: Ludzie
          - name: tablica
            label: Tablica
          - name: flaga
            label: Flaga
          - name: zewnetrzny
            label: Link zewnętrzny
          - name: czapka
            label: Czapka absolwenta
          - name: plik
            label: Dokument
          - name: mail
            label: Koperta
      - name: pozycja
        type: boolean
        hidden: true
  - name: nawigacja
    label: Menu główne
    description: Tylko właściciel. Pozycje menu na górze każdej strony i ich rozwijane listy (komputer i telefon); grupy i linki widać też w polu ze stronami na stronach działów. Kierunki w menu „Studia” są w „Strona główna i kontakt”.
    type: file
    path: src/data/nawigacja.json
    format: json
    fields:
    - name: menu
      label: Pozycje menu
      type: object
      list:
        collapsible:
          collapsed: true
          summary: "{etykieta}"
      fields:
      - name: etykieta
        label: Etykieta
        type: string
      - name: etykieta_en
        label: 'Etykieta EN'
        type: string
      - name: adres
        label: Adres (klik w napis; przy pozycji z rozwijaną listą — strona działu, np. /instytut)
        type: string
      - name: grupy
        label: Grupy w rozwijanym menu
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{nazwa}"
        fields:
        - name: nazwa
          label: Nazwa grupy
          type: string
        - name: nazwa_en
          label: 'Nazwa grupy EN'
          type: string
        - name: opis
          label: Krótki opis na kafelku strony działu (komputer; puste = bez opisu)
          type: string
        - name: opis_en
          label: 'Krótki opis EN'
          type: string
        - name: kierunki
          label: Na początku grupy wstaw automatycznie kierunki studiów (z sekcji Kierunki)
          type: boolean
        - name: linki
          label: Linki
          type: object
          list:
            collapsible:
              collapsed: true
              summary: "{etykieta}"
          fields:
          - name: etykieta
            label: Etykieta
            type: string
            required: true
          - name: etykieta_en
            label: 'Etykieta EN'
            type: string
          - name: opis
            label: Krótki opis w polu ze stronami na stronie działu (komputer; puste = bez opisu)
            type: string
          - name: opis_en
            label: 'Krótki opis EN'
            type: string
          - name: adres
            label: Adres
            type: string
            required: true
          - name: pozycja
            type: boolean
            hidden: true
- name: deklaracja
  label: Deklaracja dostępności
  description: Tekst strony „Deklaracja dostępności” (link w stopce). Treść w jawnym Markdownie, jak w Studiach.
  type: file
  path: src/content/strony/deklaracja-dostepnosci.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: body
    label: Treść
    type: code
    options:
      format: markdown
    description: |-
      Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd).
  - name: tresc_en
    label: Treść EN
    description: "Jawny Markdown: ## rozpoczyna sekcję i pozycję spisu; {#id} zachowuje adres sekcji. Zwykły tekst jest prozą domyślnie; nie wymaga otaczających znaczników. Specjalne układy wymagają znaczników, np. :::kafelki, :::etapy, :::zakladki. Komentarze <!-- … --> objaśniają bloki; na stronie ich nie widać. Zachowaj pasujące końcowe dwukropki. Plik PDF: wgraj w „Media” i wklej link. Wygląd sprawdzaj po przebudowaniu strony (Podgląd). Puste = strona angielska pokaże treść polską."
    type: code
    options:
      format: markdown
  - name: format_tresci
    label: Format treści
    type: string
    hidden: true
    default: jawne
  - name: opis
    label: Krótki opis (Google i podgląd linku)
    description: Na samej stronie się nie wyświetla (baner pokazuje tytuł). Puste = ogólny opis serwisu.
    type: text
  - name: opis_en
    label: 'Krótki opis EN'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
    hidden: true
  - name: haslo_en
    label: 'Hasło na banerze EN'
    type: string
    hidden: true
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
    hidden: true
