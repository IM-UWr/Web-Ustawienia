            label: Kalendarz
          - name: zegar
            label: Zegar
          - name: ludzie
            label: Ludzie
          - name: tablica
            label: Tablica
          - name: flaga
            label: Flaga
          - name: zewnetrzny
            label: Link zewnętrzny
          - name: czapka
            label: Czapka absolwenta
          - name: plik
            label: Dokument
          - name: mail
            label: Koperta
  - name: nawigacja
    label: Menu główne
    type: file
    path: src/data/nawigacja.json
    format: json
    fields:
    - name: menu
      label: Pozycje menu
      type: object
      list: true
      fields:
      - name: etykieta
        label: Etykieta
        type: string
      - name: etykieta_en
        label: 'EN: etykieta'
        type: string
      - name: adres
        label: Adres (klik w napis; przy pozycji z rozwijaną listą — strona działu, np. /instytut)
        type: string
      - name: grupy
        label: Grupy w rozwijanym menu
        type: object
        list: true
        fields:
        - name: nazwa
          label: Nazwa grupy
          type: string
        - name: nazwa_en
          label: 'EN: nazwa grupy'
          type: string
        - name: opis
          label: Krótki opis na kafelku strony działu (komputer; puste = bez opisu)
          type: string
        - name: opis_en
          label: 'EN: krótki opis'
          type: string
        - name: kierunki
          label: Na początku grupy wstaw automatycznie kierunki studiów (z sekcji Kierunki)
          type: boolean
        - name: linki
          label: Linki
          type: object
          list: true
          fields:
          - name: etykieta
            label: Etykieta
            type: string
          - name: etykieta_en
            label: 'EN: etykieta'
            type: string
          - name: opis
            label: Krótki opis w polu ze stronami na stronie działu (komputer; puste = bez opisu)
            type: string
          - name: opis_en
            label: 'EN: krótki opis'
            type: string
          - name: adres
            label: Adres
            type: string
- name: deklaracja
  label: Deklaracja dostępności
  type: file
  path: src/content/strony/deklaracja-dostepnosci.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/ustawienia
    description: |-
      Piszesz jak w zwykłym edytorze; akapity oddziela Enter. Nagłówek 2 = nowa sekcja (pojawi się w spisie „Na tej stronie”).

      Gdy włączone jest pole „Bloki” (niżej), kilka układów strona rozpoznaje sama:

      • Punkt listy zaczynający się pogrubieniem = kafelek.

      • Lista numerowana z pogrubionym początkiem = oś kroków.

      • Punkt z rolą kursywą i nazwiskiem pogrubionym = kontakt.

      • Lista samych linków = lista plików (PDF / strona).

      • Nagłówek 3 zakończony znakiem „?” = rozwijane pytanie.

      • Tekst nad listą (Seminaria, Konferencje, Aktualności…): lista stoi pod całym tekstem, chyba że jest kotwica — np. na stronie Publikacje tekst pod nagłówkiem 2 „Czasopisma redagowane w Instytucie” stoi nad listą czasopism.

      • Plik PDF: wgraj w „Media” i wklej link.

      • Akapit zaczynający się od dwuliterowego skrótu z kropką („Np.”, „Dr.”, „No.”) edytor zapisze jako listę numerowaną „1.” — zacznij akapit inaczej albo pogrub skrót.

      Więcej: ściągawka edytora (dok/sciagawka-edytora.md w Web-Core).
  - name: tytul_en
    label: Tytuł EN
    type: string
  - name: tresc_en
    label: Treść EN
    description: Cała strona po angielsku, w tym samym układzie co Treść (nagłówki sekcji po angielsku). Puste = strona angielska pokaże treść polską.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/ustawienia
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
  - name: opis_en
    label: 'EN: opis'
    type: text
  - name: haslo
    label: Hasło na banerze (jedna linia; liczby w banerze pokażą się tylko razem z hasłem)
    type: string
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włączone: listy w treści stają się blokami (kafelki, oś kroków, kontakty, lista plików, rozwijane pytania) — opis przy polu „Treść”. Wyłączone: zwykłe listy.'
