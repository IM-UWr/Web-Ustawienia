# Pages CMS — formularze aktualnej strony Instytutu Matematycznego UWr.
media:
  input: public/pliki
  output: /pliki
  rename: safe
settings:
  commit:
    identity: user
content:
- name: ustawienia-grupa
  label: Ustawienia strony
  type: group
  items:
  - name: ustawienia
    label: Strona główna i kontakt
    type: file
    path: src/data/ustawienia.json
    format: json
    fields:
    - name: baner
      label: Baner na stronie głównej
      type: object
      fields:
      - name: zdjecie
        label: Zdjęcie (poziome, ok. 2400 px szerokości)
        type: image
        options:
          path: public/pliki/baner
        description: Zdjęcie wpisu lub strony, używane także w powiązanych zapowiedziach.
      - name: opis
        label: Opis zdjęcia (dla niewidomych)
        type: string
        description: Krótki opis używany na stronie lub w jej zapowiedzi.
      - name: opis_en
        label: 'EN: opis zdjęcia'
        type: string
        description: Angielska wersja pola Opis zdjęcia (dla niewidomych); puste oznacza użycie wersji polskiej.
      description: Zdjęcie okładki strony głównej, wspólne dla komputera i telefonu.
    - name: logo
      label: Logo w nagłówku (opcjonalnie)
      type: image
      options:
        path: public/pliki
      description: Opcjonalne logo w nagłówku telefonu; na komputerze pozostaje znak UWr.
    - name: wydarzenia_dni_robocze
      label: 'Wydarzenia na stronie głównej: ile dni roboczych przed początkiem się pojawiają (sekcja znika, gdy
        nic nie ma)'
      type: number
      default: 5
      description: Ile dni roboczych naprzód obejmuje zestawienie najbliższych wydarzeń na stronie aktualności.
    - name: wydarzenia_dni_telefon
      label: 'Nadchodzące wydarzenia na telefonie: ile dni naprzód'
      type: number
      description: Ile dni kalendarzowych naprzód obejmuje Szybki dostęp, na komputerze i telefonie.
    - name: wstep
      label: Opis do wyszukiwarek
      type: text
      description: Opis strony do wyszukiwarek i udostępniania linków; nagłówek nowej strony nie pokazuje tego akapitu.
    - name: wstep_en
      label: Opis do wyszukiwarek EN
      type: text
      description: Angielska wersja pola Opis do wyszukiwarek; puste oznacza użycie wersji polskiej.
    - name: szukaj_haslo
      label: 'Hasło na banerze: Szukaj'
      type: string
      description: Hasło w nagłówku strony Szukaj.
    - name: szukaj_haslo_en
      label: 'EN: hasło na banerze: Szukaj'
      type: string
      description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
    - name: studia
      label: Sekcja „Studiuj matematykę”
      type: object
      fields:
      - name: opis
        label: Opis
        type: string
        description: Opis sekcji studiów na stronie głównej; jest wyświetlany pod jej tytułem.
      - name: opis_en
        label: 'EN: opis'
        type: string
        description: Angielska wersja pola Opis; puste oznacza użycie wersji polskiej.
      description: Opis sekcji studiów na stronie głównej. Kafelki i adres rekrutacji pochodzą z Menu głównego.
    - name: kontakt
      label: Dane kontaktowe (stopka)
      type: object
      fields:
      - name: adres
        label: Adres
        type: string
        description: Adres naszej strony zaczyna się od /; zewnętrzny od https://.
      - name: telefon
        label: Telefon
        type: string
        description: Numer telefonu do kontaktu; przy osobach spoza administracji obowiązują zasady spisu pracowników.
      - name: email
        label: E-mail
        type: string
        description: Adres e-mail do kontaktu.
      description: E-mail wyświetlany przy koordynatorach seminarium.
    - name: archiwum
      label: Adres archiwum starej strony
      type: string
      description: Adres archiwalnych materiałów, dostępny jako link na stronie.
    - name: powiadomienia
      label: Powiadomienia e-mail o referatach
      type: object
      fields:
      - name: adres
        label: Adres automatu listy mailingowej (Google Apps Script, …/exec; puste = zapisy wyłączone)
        type: string
        description: Adres automatu zapisów kończący się na /exec. Puste pole wyłącza zapisy na referaty.
      description: Ustawienia formularza zapisu na powiadomienia o referatach.
    description: Zdjęcie okładki, opisy do wyszukiwarek, kontakt i ustawienia wydarzeń. Menu oraz kafelki kierunków
      edytuj razem w Menu główne.
  - name: skroty
    label: Kafelki „Na skróty”
    type: file
    path: src/data/skroty.json
    format: json
    fields:
    - name: kafelki
      label: Kafelki
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{etykieta}'
      fields:
      - name: etykieta
        label: Etykieta
        type: string
        description: Napis wyświetlany przy tej pozycji.
      - name: etykieta_en
        label: 'EN: etykieta'
        type: string
        description: Angielska wersja pola Etykieta; puste oznacza użycie wersji polskiej.
      - name: adres
        label: Adres (np. /pracownicy albo https://…)
        type: string
        description: Adres naszej strony zaczyna się od /; zewnętrzny od https://.
      description: Linki Szybkiego dostępu, w kolejności wyświetlania; strona pokazuje cztery pierwsze.
    description: Cztery pierwsze pozycje tworzą Szybki dostęp. Opis planu, kalendarza i spisu pracowników jest uzupełniany
      automatycznie.
  - name: nawigacja
    label: Menu główne
    type: file
    path: src/data/nawigacja.json
    format: json
    fields:
    - name: menu
      label: Pozycje menu
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{etykieta}'
      fields:
      - name: etykieta
        label: Etykieta
        type: string
        description: Napis wyświetlany przy tej pozycji.
      - name: etykieta_en
        label: 'EN: etykieta'
        type: string
        description: Angielska wersja pola Etykieta; puste oznacza użycie wersji polskiej.
      - name: w_menu
        label: Pokaż w menu
        type: boolean
        default: true
        description: Włącza pozycję w menu. Wyłączenie nie usuwa jej strony ani nie wpływa na statystyki.
      - name: w_pasku
        label: Pokaż także w górnym pasku na komputerze
        type: boolean
        default: true
        description: Wyłącz, aby pozycja była dostępna tylko w panelu menu, np. Rekrutacja.
      - name: rekrutacja
        label: Użyj tego adresu w przyciskach rekrutacji
        type: boolean
        default: false
        description: Wybierz przy jednej pozycji. Jej adres zasila również przyciski rekrutacji na stronach studiów.
      - name: adres
        label: Adres (klik w napis; przy pozycji z rozwijaną listą — strona działu, np. /instytut)
        type: string
        required: true
        description: Adres naszej strony zaczyna się od /; zewnętrzny od https://.
      - name: grupy
        label: Grupy w rozwijanym menu
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{nazwa}'
        fields:
        - name: nazwa
          label: Nazwa grupy
          type: string
          description: Nazwa wyświetlana na stronie i powiązanych listach.
        - name: nazwa_en
          label: 'EN: nazwa grupy'
          type: string
          description: Angielska wersja pola Nazwa grupy; puste oznacza użycie wersji polskiej.
        - name: w_menu
          label: Pokaż w menu
          type: boolean
          default: true
          description: Włącza pozycję w menu. Wyłączenie nie usuwa jej strony ani nie wpływa na statystyki.
        - name: opis
          label: Krótki opis na kafelku strony działu (komputer; puste = bez opisu)
          type: string
          description: Krótki opis używany na stronie lub w jej zapowiedzi.
        - name: opis_en
          label: 'EN: krótki opis'
          type: string
          description: Angielska wersja pola Krótki opis na kafelku strony działu (komputer; puste = bez opisu);
            puste oznacza użycie wersji polskiej.
        - name: linki
          label: Linki
          type: object
          list:
            collapsible:
              collapsed: true
              summary: '{etykieta}'
          fields:
          - name: etykieta
            label: Etykieta
            type: string
            description: Napis wyświetlany przy tej pozycji.
          - name: etykieta_en
            label: 'EN: etykieta'
            type: string
            description: Angielska wersja pola Etykieta; puste oznacza użycie wersji polskiej.
          - name: w_menu
            label: Pokaż w menu
            type: boolean
            default: true
            description: Włącza pozycję w menu. Wyłączenie nie usuwa jej strony ani nie wpływa na statystyki.
          - name: opis
            label: Krótki opis w polu ze stronami na stronie działu (komputer; puste = bez opisu)
            type: string
            description: Krótki opis używany na stronie lub w jej zapowiedzi.
          - name: opis_en
            label: 'EN: krótki opis'
            type: string
            description: Angielska wersja pola Krótki opis w polu ze stronami na stronie działu (komputer; puste
              = bez opisu); puste oznacza użycie wersji polskiej.
          - name: adres
            label: Adres
            type: string
            description: Adres naszej strony zaczyna się od /; zewnętrzny od https://.
          - name: na_stronie_glownej
            label: Pokaż kafelek na stronie głównej
            type: boolean
            default: false
            description: Włącza kafelek w sekcji studiów na stronie głównej, niezależnie od widoczności w menu.
          - name: kafelek_nazwa
            label: Nazwa kafelka
            type: string
            description: Nazwa kafelka na stronie głównej; puste oznacza nazwę z menu.
          - name: kafelek_nazwa_en
            label: Nazwa kafelka EN
            type: string
            description: Angielska wersja pola Nazwa kafelka; puste oznacza użycie wersji polskiej.
          - name: kafelek_poziom
            label: Napis nad nazwą kafelka
            type: string
            description: Krótki napis nad nazwą kafelka, np. I i II stopień.
          - name: kafelek_poziom_en
            label: Napis nad nazwą kafelka EN
            type: string
            description: Angielska wersja pola Napis nad nazwą kafelka; puste oznacza użycie wersji polskiej.
          - name: kafelek_opis
            label: Opis kafelka
            type: string
            description: Opis kafelka na stronie głównej; puste oznacza opis pozycji menu.
          - name: kafelek_opis_en
            label: Opis kafelka EN
            type: string
            description: Angielska wersja pola Opis kafelka; puste oznacza użycie wersji polskiej.
          description: Ręcznie dodawane linki. Kafelek na stronie głównej można włączyć niezależnie od widoczności
            w menu.
        description: Podgrupy tej pozycji menu, w kolejności wyświetlania. Nazwa i opis pojawiają się też na stronie
          działu.
      description: Pozycje główne. Kolejność listy obowiązuje na komputerze i telefonie. Pokaż w menu dotyczy również
        grup i linków.
    description: Całe menu oraz powiązane kafelki. Kolejność list jest kolejnością na stronie. Żadna pozycja nie
      jest dopisywana automatycznie. Link może być ukryty w menu i nadal mieć kafelek.
  description: Powiązane formularze ustawień strony.
- name: deklaracja
  label: Deklaracja dostępności
  type: file
  path: src/content/strony/deklaracja-dostepnosci.md
  format: yaml-frontmatter
  fields:
  - name: tytul
    label: Tytuł
    type: string
    required: true
    description: Nazwa strony lub wpisu, widoczna także na odpowiednich listach i w wynikach wyszukiwania.
  - name: status_publikacji
    label: Status publikacji
    type: select
    required: true
    default: oficjalna
    description: Zapisuje wybór do przyszłej publikacji. Obecnie nie zmienia widoczności. Podgląd jest publiczny.
    options:
      values:
      - name: oficjalna
        label: Opublikowana — strona oficjalna i podgląd
      - name: podglad
        label: Tylko podgląd
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
      path: public/pliki/ustawienia
    description: Tekst strony; nagłówek 2 tworzy sekcję. Opcja Bloki włącza układy cech, etapów, kontaktów, plików
      i pytań z list w tekście.
  - name: tytul_en
    label: Tytuł EN
    type: string
    description: Angielska wersja pola Tytuł; puste oznacza użycie wersji polskiej.
  - name: tresc_en
    label: Treść EN
    description: Tekst strony po angielsku; puste oznacza wyświetlanie tekstu polskiego. Układ treści jest taki
      sam jak w polskim opisie.
    type: rich-text
    options:
      format: markdown
      path: public/pliki/ustawienia
  - name: opis
    label: Krótki opis (pod tytułem i w Google)
    type: text
    description: Opis strony do wyszukiwarek i udostępniania linku.
  - name: opis_en
    label: 'EN: opis'
    type: text
    description: Angielska wersja pola Krótki opis (pod tytułem i w Google); puste oznacza użycie wersji polskiej.
  - name: haslo
    label: Hasło w nagłówku
    type: string
    description: Krótkie hasło w nagłówku, widoczne razem z liczbami. Na okładce działu służy również jako podpis.
  - name: haslo_en
    label: 'EN: hasło na banerze'
    type: string
    description: Angielskie hasło; puste pole nie zastępuje go polskim hasłem.
  - name: pasek_boczny
    label: 'Prawy pasek: spis „Na tej stronie”, menu działu czy oba (puste = domyślnie tylko spis)'
    type: select
    options:
      values:
      - name: oba
        label: Oba (spis i menu działu)
      - name: spis
        label: Tylko spis „Na tej stronie”
      - name: menu
        label: Tylko menu działu (podstrony)
      - name: brak
        label: Bez prawego paska (strona na całą szerokość)
    description: Spis sekcji jest widoczny przy opcji Spis lub Oba. Menu i Brak wyłączają spis; ta wersja strony
      nie wyświetla bocznego menu działu.
  - name: bloki
    label: Kafelki, oś i kontakty z list — zob. ściągawka
    type: boolean
    default: false
    description: 'Włącz, aby z list w tekście powstawały bloki treści: cechy, etapy, kontakty, pliki i pytania.'
  - name: opublikowany
    label: Dotychczasowe uwzględnianie w zestawieniach
    type: boolean
    hidden: true
    default: true
    description: Zachowuje dotychczasową widoczność w zestawieniach i indeksowanie. To osobna opcja od statusu publikacji.
  description: Treść strony Deklaracja dostępności. Adres i miejsce w menu pozostają ustawiane osobno.
