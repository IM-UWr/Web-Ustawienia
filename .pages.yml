          - name: kadr
            label: Kadr (np. center 40%)
            type: string
        - name: nauka
          label: Nauka
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr (np. center 40%)
            type: string
        - name: studia
          label: Studia
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr (np. center 40%)
            type: string
        - name: aktualnosci
          label: Aktualności
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            type: image
            options:
              path: public/pliki/naglowki
          - name: kadr
            label: Kadr (np. center 40%)
            type: string
        - name: popularyzacja
          label: Popularyzacja
          type: object
          fields:
          - name: zdjecie
            label: Zdjęcie
            type: image
            options:
