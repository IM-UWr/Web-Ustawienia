        label: Zdjęcie (poziome, ok. 2400 px szerokości)
        type: image
        options:
          path: public/pliki/baner
      - name: zdjecie_male
        label: Mniejsza wersja na telefony (opcjonalnie, ok. 1200 px)
        hidden: true
        type: image
        options:
          path: public/pliki/baner
      - name: zdjecie_telefon
        label: Zdjęcie na telefon (nieużywane)
        type: image
        hidden: true
        options:
          path: public/pliki/baner
      - name: opis
        label: Opis zdjęcia (dla niewidomych)
        type: string
      - name: opis_en
        label: 'EN: opis zdjęcia'
        type: string
      - name: podpis
        label: Podpis (np. Fot. Jan Kowalski)
        hidden: true
        type: string
      - name: podpis_en
        label: 'EN: podpis (np. Photo: Jan Kowalski)'
        hidden: true
        type: string
      - name: podpis_telefon
        label: Podpis na telefonie (nieużywany)
        type: string
        hidden: true
      - name: podpis_telefon_en
        label: 'EN: podpis na telefonie (nieużywany)'
        type: string
        hidden: true
      - name: kadr
        label: Kadrowanie (np. center 55%)
        hidden: true
        type: string
    - name: logo
      label: Logo w nagłówku (opcjonalnie)
      type: image
      options:
        path: public/pliki
    - name: tlo_strony
      label: Tło strony
      hidden: true
      type: select
      default: zmierzch
      options:
        values:
        - name: zmierzch
          label: Zmierzch
        - name: pole
          label: Pole kierunków
        - name: kratka
          label: Kratka / tablica
        - name: penrose
          label: Kafelkowanie Penrose'a
        - name: fale
          label: Fale (izolinie)
        - name: brak
          label: Brak (białe)
    - name: sekcje
      label: Oddzielanie sekcji
      hidden: true
      type: select
      default: pasy
      options:
        values:
        - name: pasy
          label: Pasy
        - name: linia
          label: Linia
        - name: karty
          label: Karty
        - name: brak
          label: Brak
    - name: naglowki_podstron
      label: Nagłówki podstron
      hidden: true
      type: object
      fields:
      - name: wariant
        label: Wygląd
        type: select
        default: granat
        options:
